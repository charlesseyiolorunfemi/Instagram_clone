<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Clone</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;}
  
  .container{width:360px;padding:30px 25px;text-align:center;}
  
  
  .fb-btn span{font-size:20px;font-weight:bold;}
  .divider{display:flex;align-items:center;gap:15px;margin:22px 0;color:#8e8e8e;font-size:13px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#dbdbdb;}
  input{
    width:100%;padding:12px 10px;margin-bottom:10px;
    border:1px solid #dbdbdb;border-radius:4px;
    background:#fafafa;font-size:14px;outline:none;
  }
  input::placeholder{color:#8e8e8e;font-size:13px;}
  input:focus{border-color:#a8a8a8;}
  
  .login-btn{
    width:100%;padding:10px;background:#8ec0f0;
    color:#fff;border:none;border-radius:5px;
    font-weight:600;font-size:15px;cursor:pointer;
  }
  .login-btn:hover{background:#4da0f5;}
  

</style>
</head>
<body style="background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;">
    
  <div class="container">
    <h1 style="font-family: 'Brush Script MT', cursive; font-size:42px; margin-bottom:30px;">UI clone</h1>

    <button style=" background:#1877F2;color:#fff;border:none;
    width:100%;padding:10px;border-radius:5px;
    font-size:15px;font-weight:600;display:flex;
    justify-content:center;align-items:center;gap:8px;
    cursor:pointer;">
      <span>D</span> Continue with Demo
    </button>

    <div class="divider">OR</div>

    <input type="text" placeholder="phone number, username, or email">
    <input type="password" placeholder="password">
    <a href="#" style="display:block;text-align:right;font-size:13px;color:#00376b;text-decoration:none;margin:4px 0 20px 0;font-weight:500;">Forgot password?</a>

    <button class="login-btn">Log In</button>

    <p style="margin-top:30px;font-size:14px;color:#8e8e8e;">Don't have an account? <a href="#" style="color:#00376b;font-weight:600;text-decoration:none;">sign up</a></p>
  </div>
</body>
</html>
